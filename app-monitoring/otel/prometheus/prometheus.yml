global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metrics your apps send to the collector via OTLP
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Example: scrape an app running on your machine that exposes /metrics on port 9464
  # - job_name: my-app
  #   static_configs:
  #     - targets: ["host.docker.internal:9464"]
