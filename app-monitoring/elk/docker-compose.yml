# Elasticsearch + Kibana (single node, security disabled — local development only).
#
# Recommended:   ./setup.sh elk           (from the repo root)
# Manual:        docker compose --env-file ../../.env up -d
#
# Needs roughly 2 GB of free memory for Docker.

name: app-monitoring-elk

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-9.5.5}
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}"
    volumes:
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${BIND_IP:-127.0.0.1}:${ES_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 8 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-9.5.5}
    container_name: kibana
    restart: unless-stopped
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "${BIND_IP:-127.0.0.1}:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 8 http://127.0.0.1:5601/api/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s # Kibana can take a few minutes to boot on a busy laptop

volumes:
  es_data:
